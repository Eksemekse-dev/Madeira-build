name: Build Madeira IPA

on:
  workflow_dispatch: # Pozwala ręcznie uruchomić budowanie przyciskiem "Run workflow"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run build scripts
        run: |
          chmod +x build/*/*.sh
          for script in build/*/*.sh; do
            echo "Executing $script..."
            "$script" || true
          done

      - name: Build with xcodebuild
        run: |
          xcodebuild -scheme Madeira -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO build

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          mv build/Release-iphoneos/*.app Payload/ 2>/dev/null || mv build/*.app Payload/ 2>/dev/null || true
          zip -r Madeira.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: Madeira.ipa
